apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sem "namespace:" aqui: há NetworkPolicies nos namespaces mariadb e minio.
# Aplicar: kubectl apply -k backup
resources:
  - configmap.yaml
  - cronjob.yaml
  - sealed-secret.yaml   # SealedSecret "nextcloud-backup" (restic + MinIO + R2)
  - networkpolicy.yaml
  - prometheusrule.yaml
