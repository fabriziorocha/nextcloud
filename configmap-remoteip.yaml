apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-remoteip
data:
  # Montado em /etc/apache2/conf-enabled/remoteip.conf (mod_remoteip).
  # Recupera o IP real do cliente a partir do header CF-Connecting-IP,
  # confiando nos proxies internos do cluster/LAN.
  remoteip.conf: |
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
    RemoteIPInternalProxy 10.244.0.0/24
