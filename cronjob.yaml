apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
spec:
  schedule: "*/5 * * * *"
  # Forbid: se um cron passar dos 5 min, o próximo NÃO sobe em paralelo. Sem isso
  # um cron.php travado empilha pods (que não têm limite de memória) e derruba o
  # node por pressão de memória.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Mata o job se cron.php ficar preso além de 15 min.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            # Usado só pela NetworkPolicy `nextcloud-cron-egress`. Não bate no
            # selector do Service (`app: nextcloud`), então o pod de cron não
            # recebe tráfego HTTP. (No cluster "as-is" o pod não tinha labels.)
            app: nextcloud-cron
        spec:
          restartPolicy: OnFailure
          # Compatível com Pod Security "restricted" (ver namespace.yaml).
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nextcloud-cron
              # Mesma tag do pod web, fixada via `images:` no kustomization.yaml.
              image: nextcloud
              command:
                - sh
                - -c
                - "echo 'Iniciando cron do Nextcloud...'; php /var/www/html/cron.php 2>&1; status=$?; echo 'Cron do Nextcloud finalizado.'; exit $status"
              securityContext:
                runAsUser: 33          # www-data
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # Uso observado: ~60Mi / ~2m. Limite dá teto p/ não afetar o node
              # (o pod web tem prioridade; o cron é best-effort).
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  memory: "512Mi"
              volumeMounts:
                - name: nextcloud
                  mountPath: /var/www/html/
          volumes:
            - name: nextcloud
              persistentVolumeClaim:
                claimName: nextcloud
