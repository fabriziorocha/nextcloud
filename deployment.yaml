apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  # as-is: no cluster a strategy é a padrão (RollingUpdate 25%/25%). Com PVC RWO
  # + dados no volume isso pode travar num rollout; o certo seria `Recreate`.
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
        - name: nextcloud
          # as-is: imagem SEM tag => nextcloud:latest, imagePullPolicy: Always.
          # Cada restart pode puxar um novo major (hoje: 34.0.3). Nextcloud não
          # suporta pular major version — o certo seria fixar `nextcloud:34-apache`.
          image: nextcloud
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: nextcloud-config
            - secretRef:
                name: nextcloud-secret
          volumeMounts:
            - name: nextcloud
              mountPath: /var/www/html/
            - name: skeleton
              mountPath: /var/www/html/data/default
            - name: remoteip
              mountPath: /etc/apache2/conf-enabled/remoteip.conf
              subPath: remoteip.conf
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
          # Valores REAIS no cluster (ajustados à mão via Lens). O manifesto
          # original versionado pedia requests 2CPU/4Gi e limits 4CPU/8Gi.
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "3Gi"
      volumes:
        - name: nextcloud
          persistentVolumeClaim:
            claimName: nextcloud
        - name: skeleton
          emptyDir: {}
        - name: remoteip
          configMap:
            name: nextcloud-remoteip
