apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      # No cluster o PVC está Bound com 256Gi (o manifesto original pedia 256Gi;
      # local-path/hostPath não faz enforcement real de quota).
      storage: 256Gi
