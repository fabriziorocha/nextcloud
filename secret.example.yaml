# ------------------------------------------------------------------------------
# TEMPLATE — copie para secret.local.yaml (que está no .gitignore) e preencha,
# depois gere o sealed:
#
#   cp secret.example.yaml secret.local.yaml
#   # edite os valores
#   kubeseal --format yaml --controller-namespace kube-system \
#     < secret.local.yaml > sealed-secret.yaml
#   # migração (Secret atual não é gerenciado pelo controller):
#   kubectl -n nextcloud delete secret nextcloud-secret
#   kubectl apply -k .
#
# - MYSQL_PASSWORD: senha do usuário `nextcloud` no MariaDB.
# - NEXTCLOUD_ADMIN_PASSWORD: só é lida na INSTALAÇÃO inicial. Numa instância
#   já instalada, a senha real do admin vive no banco — troque com
#   `occ user:resetpassword admin` (feito em 2026-09-03). Mantida aqui só para
#   consistência em caso de reinstalação do zero.
# - REDIS_HOST_PASSWORD: senha do Redis (projeto `redis`). É lida a CADA request
#   por `config/redis.config.php` (imagem oficial), que sobrescreve o bloco
#   `redis` do config.php. Ou seja: `occ config:system:set redis password` NÃO
#   funciona de forma durável — tem que ser esta env. Precisa bater com o
#   `requirepass` do Redis.
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secret
  namespace: nextcloud
type: Opaque
stringData:
  MYSQL_PASSWORD: "REPLACE_senha_do_usuario_nextcloud_no_mariadb"
  NEXTCLOUD_ADMIN_PASSWORD: "REPLACE_senha_forte_do_admin"
  REDIS_HOST_PASSWORD: "REPLACE_senha_do_redis"
